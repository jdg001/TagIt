<!-- Full-screen login page -->
<div class="login-container" [class.dark-theme]="isDarkMode">
  <!-- Animated wave background -->
  <div class="wave-background">
    <div class="wave-layer"></div>
    <div class="wave-layer"></div>
    <div class="wave-layer"></div>
    <div class="wave-layer"></div>
    <div class="wave-layer"></div>
    <div class="wave-layer"></div>
    <div class="wave-layer"></div>
    <div class="wave-layer"></div>
  </div>
  
  <!-- Structured line patterns -->
  <div class="line-patterns">
    <div class="line-grid"></div>
    <div class="diagonal-lines"></div>
    <div class="curved-lines"></div>
    <div class="cross-hatch"></div>
  </div>
  
  <!-- Floating particles -->
  <div class="floating-particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>

  <!-- Comets -->
  <div class="comets">
    <div class="comet"></div>
    <div class="comet"></div>
    <div class="comet"></div>
    <div class="comet"></div>
    <div class="comet"></div>
    <div class="comet"></div>
  </div>

  <!-- Studio text -->
  <div class="studio-text-container">
    <span class="studio-text">Label Design Studio</span>
  </div>

  <!-- Theme toggle -->
  <div class="theme-toggle-container">
    <button 
      class="theme-toggle" 
      (click)="toggleTheme()"
      [title]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'"
    >
      <svg *ngIf="isDarkMode" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="2"/>
        <path d="M12 1V3M12 21V23M4.22 4.22L5.64 5.64M18.36 18.36L19.78 19.78M1 12H3M21 12H23M4.22 19.78L5.64 18.36M18.36 5.64L19.78 4.22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <svg *ngIf="!isDarkMode" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <!-- Floating error message -->
  <div *ngIf="errorMessage" class="floating-error-bar">
    <div class="error-content">
      <div class="error-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
          <line x1="15" y1="9" x2="9" y2="15" stroke="currentColor" stroke-width="2"/>
          <line x1="9" y1="9" x2="15" y2="15" stroke="currentColor" stroke-width="2"/>
        </svg>
      </div>
      <div class="error-text-content">
        <p class="error-text">{{ errorMessage }}</p>
        <p class="error-help">Please contact your administrator to register your account and assign a role.</p>
      </div>
    </div>
    <button type="button" class="error-close" (click)="clearError()" title="Close error message">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2"/>
        <line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2"/>
      </svg>
    </button>
  </div>

  <!-- Centered card -->
  <div class="login-card">
    <!-- Card header -->
    <div class="login-header">
      <div class="login-logo">
        <img src="assets/tagit-logo.svg" alt="TagIt Logo" width="80" height="80">
      </div>
      <h1 class="login-title">Welcome to tagIT</h1>
      <p class="login-subtitle">{{ getSubtitleText() }}</p>
    </div>

    <!-- Card content -->
    <div class="login-content">
      <form (ngSubmit)="continueLogin()" class="login-form">
        <div class="form-group">
          <label for="email" class="form-label">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="email"
            class="form-input"
            placeholder="Enter your email address"
            required
            autocomplete="email"
            (input)="onEmailChange()"
          />
        </div>

        <!-- Password field for admin user -->
        <div class="form-group" *ngIf="showPasswordField">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            [(ngModel)]="password"
            class="form-input"
            placeholder="Enter your password"
            required
            autocomplete="current-password"
            (input)="clearError()"
          />
        </div>

        <button type="submit" class="continue-button" [disabled]="isLoading">
          <span class="button-text" *ngIf="!isLoading">{{ getButtonText() }}</span>
          <span class="button-text" *ngIf="isLoading">{{ getLoadingText() }}</span>
          <svg *ngIf="!isLoading" class="button-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 12H19M19 12L12 5M19 12L12 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <svg *ngIf="isLoading" class="button-icon loading-spinner" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="31.416" stroke-dashoffset="31.416">
              <animate attributeName="stroke-dasharray" dur="2s" values="0 31.416;15.708 15.708;0 31.416" repeatCount="indefinite"/>
              <animate attributeName="stroke-dashoffset" dur="2s" values="0;-15.708;-31.416" repeatCount="indefinite"/>
            </circle>
          </svg>
        </button>
      </form>
    </div>
  </div>
</div>
