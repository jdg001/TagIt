<!-- Navigation Sidebar -->
<nav class="sidebar" [class.expanded]="isSidebarExpanded" [class.dark-theme]="isDarkMode" (mouseleave)="onCloseSidebar()" >
  <div class="sidebar-content">
    <h3 class="sidebar-title">Tools</h3>

    <!-- Tool Palette -->
    <div class="tool-palette" [class.disabled]="!viewingMode.canEdit">
      <!-- Basic Text Tool -->
      <div class="tool-item draggable"
        [class.active]="selectedTool === 'text'"
        (click)="onSelectTool('text')"
        draggable="true"
        (dragstart)="onToolDragStart($event, 'text')"
        appTooltip="Text" tooltipPosition="right">
        <svg class="tool-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 7V4H20V7M9 20H15M12 4V20" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="tool-name">Text</span>
      </div>

      <!-- Textarea Tool -->
      <div class="tool-item draggable"
        [class.active]="selectedTool === 'textarea'"
        (click)="onSelectTool('textarea')"
        draggable="true"
        (dragstart)="onToolDragStart($event, 'textarea')"
        appTooltip="Textarea" tooltipPosition="right">
        <svg class="tool-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2" stroke="currentColor" stroke-width="2" fill="none"/>
          <path d="M8 8H16M8 12H16M8 16H13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="tool-name">Textarea</span>
      </div>

      <!-- Rectangle Tool -->
      <div class="tool-item draggable"
        [class.active]="selectedTool === 'rectangle'"
        (click)="onSelectTool('rectangle')"
        draggable="true"
        (dragstart)="onToolDragStart($event, 'rectangle')"
        appTooltip="Rectangle" tooltipPosition="right">
        <svg class="tool-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2" stroke="currentColor" stroke-width="2" fill="none"/>
        </svg>
        <span class="tool-name">Rectangle</span>
      </div>

      <!-- Barcode Tool -->
      <div class="tool-item draggable"
        [class.active]="selectedTool === 'barcode'"
        (click)="onSelectTool('barcode')"
        draggable="true"
        (dragstart)="onToolDragStart($event, 'barcode')"
        appTooltip="Barcode" tooltipPosition="right">
        <svg class="tool-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 5V19M8 5V19M12 5V19M16 5V19M20 5V19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="tool-name">Barcode</span>
      </div>

      <!-- QR Code Tool -->
      <div class="tool-item draggable"
        [class.active]="selectedTool === 'qr'"
        (click)="onSelectTool('qr')"
        draggable="true"
        (dragstart)="onToolDragStart($event, 'qr')"
        appTooltip="QR Code" tooltipPosition="right">
        <svg class="tool-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="3" width="5" height="5" fill="currentColor"/>
          <rect x="3" y="10" width="5" height="5" fill="currentColor"/>
          <rect x="10" y="3" width="5" height="5" fill="currentColor"/>
          <rect x="16" y="3" width="5" height="5" fill="currentColor"/>
          <rect x="16" y="10" width="5" height="5" fill="currentColor"/>
          <rect x="3" y="16" width="5" height="5" fill="currentColor"/>
          <rect x="10" y="16" width="5" height="5" fill="currentColor"/>
          <rect x="16" y="16" width="5" height="5" fill="currentColor"/>
          <rect x="10" y="10" width="2" height="2" fill="currentColor"/>
          <rect x="13" y="10" width="2" height="2" fill="currentColor"/>
          <rect x="10" y="13" width="2" height="2" fill="currentColor"/>
          <rect x="13" y="13" width="2" height="2" fill="currentColor"/>
        </svg>
        <span class="tool-name">QR Code</span>
      </div>

      <!-- Line Tool -->
      <div class="tool-item draggable"
        [class.active]="selectedTool === 'line'"
        (click)="onSelectTool('line')"
        draggable="true"
        (dragstart)="onToolDragStart($event, 'line')"
        appTooltip="Line" tooltipPosition="right">
        <svg class="tool-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 12L21 12M21 12L12 3M21 12L12 21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="tool-name">Line</span>
      </div>

      <!-- Image Tool -->
      <div class="tool-item draggable"
        [class.active]="selectedTool === 'image'"
        (click)="onSelectTool('image')"
        draggable="true"
        (dragstart)="onToolDragStart($event, 'image')"
        appTooltip="Image" tooltipPosition="right">
        <svg class="tool-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2" stroke="currentColor" stroke-width="2" fill="none"/>
          <circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/>
          <path d="M21 15L16 10L5 21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="tool-name">Image</span>
      </div>

      <div class="tool-divider" role="separator" aria-hidden="true"></div>

      <!-- Grouping Tool -->
      <div class="tool-item grouping-tool"
        [class.active]="isGroupingMode"
        (click)="onToggleGroupingMode()"
        appTooltip="Group Elements" tooltipPosition="right">
        <svg class="tool-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 7V5C3 3.89543 3.89543 3 5 3H19C20.1046 3 21 3.89543 21 5V7M3 7V19C3 20.1046 3.89543 21 5 21H19C20.1046 21 21 20.1046 21 19V7M3 7H21M8 11H16M8 15H16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="tool-name">Group</span>
      </div>

      <!-- Smart Layout Tool -->
      <div class="tool-item smart-layout-tool"
        [class.active]="isSmartLayoutMode"
        (click)="onToggleSmartLayoutMode()"
        appTooltip="Smart Layout" tooltipPosition="right">
        <svg class="tool-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 3H21V21H3V3Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M9 9H15V15H9V9Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M3 12H21M12 3V21" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
          <circle cx="12" cy="12" r="2" fill="currentColor" opacity="0.8"/>
        </svg>
        <span class="tool-name">Smart Layout</span>
      </div>

      <!-- Live Preview Tool -->
      <div class="tool-item live-preview-tool"
        [class.active]="isLivePreviewActive"
        (click)="onToggleLivePreview()"
        appTooltip="Live Preview" tooltipPosition="right">
        <svg class="tool-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M1 12C1 12 5 4 12 4C19 4 23 12 23 12C23 12 19 20 12 20C5 20 1 12 1 12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="tool-name">Live Preview</span>
      </div>
    </div>
  </div>
</nav>
